<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="app-version" content="1.0.1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>નીલકંઠ ફ્રૂટ એન્ડ વેજીટેબલ</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#d1d5db;
  --green:#1f7a3f;
  --green-light:#e9f6ef;
  --danger:#c53030;
  --radius:8px; /* Reduced for space */
}

/* 🌿 FLOATING EMOJI LAYERS */
.emoji-bg,.emoji-fg{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
.emoji-bg{z-index:0} .emoji-fg{z-index:2}
.emoji{position:absolute;animation:float linear infinite;}
.bg{font-size:30px;opacity:0.60;}
.fg{font-size:40px;opacity:0.15;animation:floatSide linear infinite;}

@keyframes float{ from{transform:translateY(110vh) rotate(0deg)} to{transform:translateY(-20vh) rotate(360deg)} }
@keyframes floatSide{ from{transform:translate(-10vw,110vh) rotate(0deg)} to{transform:translate(10vw,-20vh) rotate(360deg)} }

/* -------- UI: SINGLE SCREEN NO-SCROLL -------- */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Arial;
  background:var(--bg);
  color:var(--text);
  height: 100dvh; /* Exact mobile height */
  overflow: hidden; /* Prevent body scroll */
}

.app{
  position:relative;
  z-index:1;
  max-width:560px;
  margin:auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 4px 6px; /* Very tight padding */
  gap: 4px; /* Tight gap between cards */
}

/* Header */
.header{ text-align:center; padding: 2px 0; flex-shrink: 0; }
.header h1{ margin:0; font-size:16px; font-weight:800; }
.header p{ margin:2px 0 0; font-size:10px; color:var(--muted); }

/* Cards */
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding: 6px 8px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  flex-shrink: 0;
}

/* Flex Title row for saving space */
.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.title-row label { margin: 0; }

label{font-size:12px;font-weight:700; display:block; margin-bottom: 2px;}

/* Inputs */
input,select,textarea,button{
  width:100%;
  padding: 6px 8px; /* Small touch targets but usable */
  font-size:13px; /* Prevents auto zoom */
  border-radius:6px;
  border:1px solid #d1d5db;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--green); }

/* Mode Selection */
.mode{display:flex;gap:4px;}
.mode button{flex:1;background:#f3f4f6;font-weight:700; padding: 6px 0; font-size:12px;}
.mode .active{background:var(--green);color:#fff}

/* Split Rows for Farmer/Buyer Selection */
.split-row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

/* Items Scrolling Container (If items > 3) */
.items-container {
  overflow-y: auto;
  max-height: 140px; /* Limits height, enables inner scroll */
  padding-right: 2px;
}

/* Dynamic Rows */
.row{display:grid;gap:4px;margin-bottom:4px;}
.row.normal{grid-template-columns:1.5fr 1fr 1fr;}
.row.advanced{grid-template-columns:1.5fr 1fr 1fr;}
.row input, .row select { background: #f9fafb; }

/* Buyer Mode Compact Grid */
.row.buyer{
  background: #f9fafb;
  padding: 4px;
  border-radius: 6px;
  border: 1px solid var(--border);
  grid-template-columns: 1fr 1fr 1fr;
}
.row.buyer .veg { grid-column: span 3; } /* Veg dropdown full width */
.row.buyer .other { grid-column: span 3; }

.hidden{display:none !important;}
.other{display:none;}

/* Buttons */
.btn{border:none;font-weight:700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;}
.btn-small{ width: auto; padding: 4px 8px; font-size: 11px; margin: 0;} /* Add item button */
.btn-add{background:var(--green-light);color:var(--green)}
.btn-gen{background:var(--green);color:#fff}
.btn-wa{background:#dcfce7;color:#166534}
.btn-copy{background:#eef2ff;color:#1d4ed8}
.btn-clear{background:#fff3f3;color:var(--danger)}

/* 2x2 Grid for Actions */
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  margin-bottom: 4px;
}

/* Message Textarea Auto-Expands */
.msg-card {
  display: flex;
  flex-direction: column;
  flex-grow: 1; /* Takes all remaining vertical space */
  min-height: 0;
}
textarea{
  flex-grow: 1;
  resize: none;
  background: #fafafa;
  min-height: 40px; /* Extremely small min-height to ensure it fits */
}

/* Footer */
.footer{
  text-align:center;
  font-size:10px;
  color:var(--muted);
  margin: 0;
  flex-shrink: 0;
}

/* Hide extra things by default to save space */
.festival-switch{ display: none; }
#festivalMessage{ display: none; }
</style>
</head>

<body>
  <span id="appVersion" style="display:none;"></span>

<div class="emoji-bg">
<span class="emoji bg" style="left:14%;animation-duration:38s">🍎</span> 
<span class="emoji bg" style="left:62%;animation-duration:27s">🍏</span> 
<span class="emoji bg" style="left:23%;animation-duration:33s">🍊</span> 
<span class="emoji bg" style="left:76%;animation-duration:29s">🍌</span> 
<span class="emoji bg" style="left:44%;animation-duration:31s">🍓</span> 
<span class="emoji bg" style="left:10%;animation-duration:40s">🍅</span> 
<span class="emoji bg" style="left:60%;animation-duration:25s">🥦</span> 
<span class="emoji bg" style="left:41%;animation-duration:35s">🌶️</span>
</div>

<div class="app">

<div class="header">
  <h1>🥦 નીલકંઠ ફ્રૂટ એન્ડ વેજીટેબલ</h1>
  <p>ભાવ • બિલ • ખરીદદાર • WhatsApp</p>
</div>

<div class="card" style="padding: 4px 8px;">
  <div class="mode">
    <button id="mNormal" class="active" onclick="setMode('normal')">🟢 Normal</button>
    <button id="mAdv" onclick="setMode('advanced')">🔵 Advanced</button>
    <button id="mBuyer" onclick="setMode('buyer')">🔴 Buyer</button>
  </div>
</div>

<div id="farmerSection" class="card">
  <div class="title-row">
    <label>ખેડૂતની માહિતી</label>
  </div>
  <div class="split-row">
    <div>
      <select id="farmerSelect" onchange="toggleFarmerOther();fillFarmerMobile()">
        <option value="">નામ પસંદ કરો</option>
        <option>JK Hirani</option>
        <option>Bhumi</option>
        <option>Kumud</option>
        <option>Dharmin</option>
        <option>Shreeji Farm</option>
        <option>HMV</option>
        <option value="OTHER">અન્ય</option>
      </select>
      <input id="farmerOther" class="other" placeholder="નામ લખો" style="margin-top:4px;">
    </div>
    <input id="farmerMobile" placeholder="મોબાઇલ (91...)">
  </div>
</div>

<div id="sellerSection" class="card">
  <div class="title-row">
    <label>શાક અને ભાવ</label>
    <button class="btn btn-add btn-small" onclick="addSellerItem()">➕ ઉમેરો</button>
  </div>
  <div id="sellerItems" class="items-container"></div>
</div>

<div id="buyerSection" class="card hidden">
  <div class="title-row">
    <label>ખરીદદાર</label>
    <input id="otherExpense" placeholder="અન્ય ખર્ચ ₹" style="width: 80px; padding:4px; font-size:11px;">
  </div>
  <div class="split-row" style="margin-bottom: 4px;">
    <div>
      <select id="buyerSelect" onchange="toggleBuyerOther();fillBuyerMobile()">
        <option value="">નામ પસંદ કરો</option>
        <option>Mohan</option>
        <option>Mansoor</option>
        <option>Ramesh</option>
        <option value="OTHER">અન્ય</option>
      </select>
      <input id="buyerOther" class="other" placeholder="નામ લખો" style="margin-top:4px;">
    </div>
    <input id="buyerMobile" placeholder="મોબાઇલ (91...)">
  </div>
  
  <div class="title-row" style="margin-top: 6px;">
    <label style="color:var(--green)">આઇટમ્સ</label>
    <button class="btn btn-add btn-small" onclick="addBuyerItem()">➕ ઉમેરો</button>
  </div>
  <div id="buyerItems" class="items-container"></div>
</div>

<div class="card msg-card">
  <div class="action-grid">
    <button class="btn btn-gen" onclick="generate()">📄 બનાવો</button>
    <button class="btn btn-wa" onclick="sendWhatsApp()">📲 WhatsApp</button>
    <button class="btn btn-copy" onclick="copyText()">📋 કૉપી</button>
    <button class="btn btn-clear" onclick="clearAll()">🧹 ક્લિયર</button>
  </div>
  <textarea id="message" readonly placeholder="અહીં મેસેજ દેખાશે..."></textarea>
</div>

<div class="footer">
  Pritesh Hirani | Hirani Tech © <span id="year"></span>
</div>

</div>

<script>
document.getElementById("year").innerText=new Date().getFullYear();

let MODE="normal";

const VEGS=["ટામેટા","મરચાં","બટાકા","ડુંગળી","કાકડી","ગાજર","રીંગણ","બાજરીયા રીંગણ","પાલક","દૂધી","પેતરગાલા"];

function emoji(v){
  return {"ટામેટા":"🍅","મરચાં":"🌶️","બટાકા":"🥔","ડુંગળી":"🧅","કાકડી":"🥒","ગાજર":"🥕","રીંગણ":"🍆","બાજરીયા રીંગણ":"🍆","પાલક":"🥬","દૂધી":"🥒","પેતરગાલા":"🎃"}[v]||"🥬";
}

const FARMER_PHONE={"JK Hirani":"919726764636","Bhumi":"919925311805","Kumud":"919925311805","Dharmin":"919879766839","Shreeji Farm":"91","HMV":"91"};
const BUYER_PHONE={"Mohan":"919687575039","Mansoor":"919822222222","Ramesh":"919833333333"};

function setMode(m){
  MODE=m;
  mNormal.classList.toggle("active",m==="normal");
  mAdv.classList.toggle("active",m==="advanced");
  mBuyer.classList.toggle("active",m==="buyer");

  document.getElementById("farmerSection").classList.toggle("hidden",m==="buyer");
  document.getElementById("sellerSection").classList.toggle("hidden",m==="buyer");
  document.getElementById("buyerSection").classList.toggle("hidden",m!=="buyer");
  clearAll();
}

function toggleFarmerOther(){ document.getElementById("farmerOther").style.display=document.getElementById("farmerSelect").value==="OTHER"?"block":"none"; }
function toggleBuyerOther(){ document.getElementById("buyerOther").style.display=document.getElementById("buyerSelect").value==="OTHER"?"block":"none"; }
function fillFarmerMobile(){ document.getElementById("farmerMobile").value=document.getElementById("farmerSelect").value==="OTHER"?"91":(FARMER_PHONE[document.getElementById("farmerSelect").value]||"91"); }
function fillBuyerMobile(){ document.getElementById("buyerMobile").value=document.getElementById("buyerSelect").value==="OTHER"?"91":(BUYER_PHONE[document.getElementById("buyerSelect").value]||"91"); }

function vegSelect(){
  return `<select class="veg" onchange="toggleVegOther(this)">
    <option value="">શાક</option>
    ${VEGS.map(v=>`<option>${v}</option>`).join("")}
    <option value="OTHER">અન્ય</option>
  </select>`;
}

function toggleVegOther(sel){
  sel.parentElement.querySelector(".other").style.display=sel.value==="OTHER"?"block":"none";
}

function addSellerItem(){
  const r=document.createElement("div");
  r.className="row "+(MODE==="advanced"?"advanced":"normal");
  r.innerHTML=`
    ${vegSelect()}
    <input class="other" placeholder="શાકનું નામ">
    <input class="price" placeholder="ભાવ ₹">
    ${MODE==="normal" ? `<input class="price-to" placeholder="થી ₹">` : `<input class="qty" placeholder="વજન">`}
  `;
  document.getElementById("sellerItems").appendChild(r);
}

function addBuyerItem(){
  const r=document.createElement("div");
  r.className="row buyer";
  r.innerHTML=`
    ${vegSelect()}
    <input class="other" placeholder="આઇટમ નામ">
    <input class="boxes" placeholder="બોક્સ">
    <input class="qty" placeholder="વજન">
    <input class="price" placeholder="ભાવ ₹">
    <input class="comm" placeholder="કમિશન %" value="7">
    <input class="boxrate" placeholder="મજૂરી ₹" value="4">
    <div style="grid-column: span 1"></div> `;
  document.getElementById("buyerItems").appendChild(r);
}

function getDate(){
  return new Date().toLocaleDateString("en-GB",{timeZone:"Asia/Kolkata"});
}

function generate(){
  let msg="";
  if(MODE==="buyer"){
    let base=0,comm=0,box=0;
    const buyerSel=document.getElementById("buyerSelect");
    const buyer=buyerSel.value==="OTHER"?document.getElementById("buyerOther").value:buyerSel.value;
    msg=`નમસ્તે ${buyer} 🙏\nતારીખ: ${getDate()}\n\n`;

    document.getElementById("buyerItems").querySelectorAll(".row").forEach(r=>{
      const veg=r.querySelector(".veg").value==="OTHER"? r.querySelector(".other").value: r.querySelector(".veg").value;
      const p=+r.querySelector(".price").value;
      const q=+r.querySelector(".qty").value;
      const b=+r.querySelector(".boxes").value;
      const c=+r.querySelector(".comm").value;
      const br=+r.querySelector(".boxrate").value;
      if(!veg||!p||!q)return;
      const sub=p*q;
      base+=sub; comm+=sub*(c/100); box+=b*br;
      msg+=`${emoji(veg)} ${veg} 
ભાવ ₹${p} × ${q} = ₹${sub}\n`;
    });

    const other=+document.getElementById("otherExpense").value||0;
    msg+=`\nમાલ: ₹${base.toFixed(2)}\nકમિશન: ₹${comm.toFixed(2)}\nમજૂરી: ₹${box}\nઅન્ય: ₹${other}\n\nકુલ: ₹${(base+comm+box+other).toFixed(2)}\n\n– નીલકંઠ ફ્રૂટ એન્ડ વેજીટેબલ`;
  }else{
    const farmerSel=document.getElementById("farmerSelect");
    const farmer=farmerSel.value==="OTHER"?document.getElementById("farmerOther").value:farmerSel.value;
    msg=`નમસ્તે ${farmer} 🙏\nતારીખ: ${getDate()}\n\nઆજના ભાવ:\n`;
    document.getElementById("sellerItems").querySelectorAll(".row").forEach(r=>{
      const veg=r.querySelector(".veg").value==="OTHER"? r.querySelector(".other").value: r.querySelector(".veg").value;
      const p=r.querySelector(".price").value;
      if(!veg||!p)return;
      if(MODE==="normal"){
        const p2=r.querySelector(".price-to").value;
        msg+=`${emoji(veg)} ${veg} : ₹${p}${p2?` - ₹${p2}`:""}\n`;
      }else{
        const q=r.querySelector(".qty").value;
        msg+=`${emoji(veg)} ${veg} : ₹${p} × ${q} = ₹${p*q}\n`;
      }
    });
    msg+=`\n– નીલકંઠ ફ્રૂટ એન્ડ વેજીટેબલ`;
  }
  document.getElementById("message").value=msg;
}

function sendWhatsApp(){
  generate();
  let phone = MODE === "buyer" ? document.getElementById("buyerMobile").value.trim() : document.getElementById("farmerMobile").value.trim();
  if (!phone || phone === "91") { alert("મોબાઇલ નંબર દાખલ કરો"); return; }
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(document.getElementById("message").value)}`, "_blank");
}

function copyText(){
  const msg = document.getElementById("message");
  msg.select();
  document.execCommand("copy");
  // alert optionally
}

function clearAll(){
  document.getElementById("farmerSelect").value=""; document.getElementById("farmerOther").value=""; document.getElementById("farmerOther").style.display="none";
  document.getElementById("buyerSelect").value=""; document.getElementById("buyerOther").value=""; document.getElementById("buyerOther").style.display="none";
  document.getElementById("sellerItems").innerHTML=""; document.getElementById("buyerItems").innerHTML="";
  document.getElementById("otherExpense").value=""; document.getElementById("message").value="";
  document.getElementById("buyerMobile").value=""; document.getElementById("farmerMobile").value="";
  MODE!=="buyer" ? addSellerItem() : addBuyerItem();
}

window.addEventListener("DOMContentLoaded", () => {
  addSellerItem();
});
</script>
</body>
</html>
